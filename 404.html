<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found - Joseph Morante</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<script>
(function(){var r=document.documentElement,f=(location.search.match(/[?&]theme=(light|dark)\b/)||[])[1];function a(){var h=new Date().getHours();r.setAttribute('data-theme',f||((h>=7&&h<19)?'light':'dark'));}a();setInterval(a,60000);})();
</script>
<style>
:root{--bg:#08080a;--fg:#e9e9ec;--mid:#a2a2ac;--faint:#6f6f79;--acc:#8fd4d8;--btn-hover:#fff}
:root[data-theme="light"]{--bg:#f6f6f3;--fg:#141416;--mid:#4d4d56;--faint:#7c7c86;--acc:#0f7a80;--btn-hover:#000}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:'Helvetica Neue',Helvetica,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:32px;box-sizing:border-box}
.box{max-width:560px}
.eyebrow{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--faint);margin-bottom:24px}
h1{margin:0;font-size:clamp(40px,7vw,80px);line-height:1;letter-spacing:-0.035em;font-weight:500}
p{margin:22px 0 0;font-size:18px;line-height:1.6;color:var(--mid)}
a{display:inline-flex;align-items:center;height:44px;padding:0 22px;margin-top:36px;border-radius:6px;background:var(--fg);color:var(--bg);text-decoration:none;font-size:14.5px;font-weight:500}
a:hover{background:var(--btn-hover)}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">404 · Not found</div>
  <h1>Nothing here.</h1>
  <p>That page doesn't exist. The data can't support a call on where it went.</p>
  <a href="/">Back to the portfolio</a>
</div>
</body>
</html>
